name: hitungin
description: "HitungIn — pencatat keuangan pribadi 100% offline, data milik pengguna."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  crypto: ^3.0.7
  drift: ^2.34.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.2.0
  go_router: ^14.6.0
  intl: any
  local_auth: ^3.0.2
  local_auth_android: ^2.0.8
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

  # Font dibundel di dalam aplikasi (tidak diunduh saat runtime) supaya
  # HitungIn tetap 100% offline. Lihat README bagian "Font".
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

# SQLite dibundel sebagai SQLCipher supaya database terenkripsi di HP.
# Lihat lib/core/db/connection.dart.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
